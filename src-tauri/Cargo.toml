[package]
name = "codex-usage-analytics"
version = "0.3.25"
description = "Local-first Codex token usage analytics"
authors = ["Codex Usage Analytics contributors"]
edition = "2021"

[lib]
name = "codex_usage_analytics_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-window-state = "=2.4.1"
auto-launch = "=0.5.0"
tauri-plugin-single-instance = "=2.4.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.37", features = ["bundled", "chrono"] }
walkdir = "2"
dirs = "6"
base64 = "0.22"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_Controls_Dialogs", "Win32_UI_WindowsAndMessaging"] }
